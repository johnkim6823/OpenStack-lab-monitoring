groups:
- name: node
  rules:
  - alert: TargetDown
    expr: up === 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: '{{ $labels.job }} 수집 대상 응답 없음: {{ $labels.instance }}'
  - alert: NodeDiskHigh
    expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})
      * 100 > 85
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.node }} 루트 디스크 {{ $value | printf "%.1f" }}% 사용'
  - alert: NodeMemoryLow
    expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 10
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.node }} 남은 메모리 {{ $value | printf "%.1f" }}%'
  - alert: NodeClockNotSynced
    expr: node_timex_sync_status == 0
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.node }} 시간 동기화 끊김'
  - alert: ServiceDown
    expr: node_systemd_unit_state{state="active"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: '{{ $labels.node }}의 {{ $labels.name }} 중지'
- name: ceph
  rules:
  - alert: CephHealthWarn
    expr: ceph_health_status == 1
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: Ceph HEALTH_WARN (ceph health detail 확인)
  - alert: CephHealthError
    expr: ceph_health_status == 2
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: Ceph HEALTH_ERR
  - alert: CephMonQuorumDegraded
    expr: sum(ceph_mon_quorum_status) < 3
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: Ceph mon quorum {{ $value }}/3
  - alert: CephOsdDown
    expr: ceph_osd_up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: '{{ $labels.ceph_daemon }} down'
- name: openstack
  rules:
  - alert: OpenStackApiDown
    expr: probe_success{job="openstack_api"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: 'API 응답 없음: {{ $labels.instance }}'
  - alert: BaseServiceDown
    expr: probe_success{job="base_tcp"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: '기반 서비스 포트 응답 없음: {{ $labels.instance }}'
